trigger:
  branches:
    include:
      - main

stages:
  - stage: Deploy
    jobs:
      - deployment: DeployToVM
        displayName: 'Deploy MySQL to VM'
        environment:
          name: '$(environmentName)'
          resourceType: VirtualMachine
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    if ! command -v az &> /dev/null; then
                      echo "Azure CLI is not installed. Installing..."
                      export DEBIAN_FRONTEND=noninteractive
                      sudo apt-get update
                      sudo apt-get install -y curl
                      curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
                    fi
                  displayName: 'Install Azure CLI'
                  failOnStderr: true

                - script: |
                    if ! command -v docker &> /dev/null; then
                      echo "Docker is not installed. Installing..."
                      export DEBIAN_FRONTEND=noninteractive
                      sudo apt-get update
                      sudo apt-get install -y apt-transport-https ca-certificates curl gnupg lsb-release
                      curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
                      echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
                      sudo apt-get update
                      sudo apt-get install -y docker-ce docker-ce-cli containerd.io
                      sudo systemctl start docker
                      sudo systemctl enable docker
                    fi
                  displayName: 'Install Docker'
                  failOnStderr: true

                - task: AzureCLI@2
                  displayName: 'Pull and run MySQL image'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    failOnStandardError: true
                    inlineScript: |
                      echo "Pulling image from Azure Container Registry..."
                      token=$(az acr login --name "$(acrName)" --expose-token --output tsv --query accessToken)
                      echo "$token" | sudo docker login "$(acrLoginServer)" \
                        --username 00000000-0000-0000-0000-000000000000 \
                        --password-stdin

                      sudo docker pull "$(acrLoginServer)/$(imageRepository):$(imageTag)"

                      if sudo docker ps -a --format '{{.Names}}' | grep -Fqx "$(containerName)"; then
                        sudo docker rm -f "$(containerName)"
                      fi

                      sudo docker run -d \
                        -p "$(hostPort):$(containerPort)" \
                        --name "$(containerName)" \
                        "$(acrLoginServer)/$(imageRepository):$(imageTag)"

                      sudo docker ps

                - script: |
                    echo "Container '$(containerName)' deployed on port $(hostPort)"
                  displayName: 'Show deployment details'
